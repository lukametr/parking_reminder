name: parking_reminder
description: თბილისის ზონალური პარკინგის შეხსენება.
publish_to: 'none'
version: 1.1.10+15

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.5
  firebase_remote_config: ^5.4.3
  cloud_firestore: ^5.6.6
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.1.0
  url_launcher: ^6.3.1
  android_intent_plus: ^5.3.0
  external_app_launcher: ^4.0.3
  google_maps_flutter: ^2.10.1
  google_mobile_ads: ^5.3.1
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/security-agent.png
    - assets/food.png
    - assets/cart.png
    - assets/garage.png
    - assets/tires.png
    - assets/pharmacy.png
    - assets/gasstation.png
    - assets/background_image.jpg
    - assets/app_logo.png
    - assets/ic_custom.png
